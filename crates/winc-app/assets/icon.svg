<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
>
  <title>obnote App Logo</title>

  <defs>
    <!-- 深石板靛蓝底板 -->
    <linearGradient
      id="background"
      x1="160" y1="60"
      x2="864" y2="964"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#2C3352"/>
      <stop offset="0.52" stop-color="#232841"/>
      <stop offset="1" stop-color="#1E2235"/>
    </linearGradient>

    <!-- 柔和顶部高光 -->
    <linearGradient
      id="bgSheen"
      x1="512" y1="52"
      x2="512" y2="520"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#4B5582" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2C3352" stop-opacity="0"/>
    </linearGradient>

    <!-- 象牙白纸页 -->
    <linearGradient
      id="sheet"
      x1="300" y1="196"
      x2="720" y2="836"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="0.65" stop-color="#F7F4EC"/>
      <stop offset="1" stop-color="#ECE8DC"/>
    </linearGradient>

    <!-- 折角阴影与折面 -->
    <linearGradient
      id="foldShadow"
      x1="604" y1="348"
      x2="764" y2="348"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#1E2235" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1E2235" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient
      id="foldFlap"
      x1="612" y1="348"
      x2="764" y2="196"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#E2DFD4"/>
      <stop offset="1" stop-color="#CFD4E3"/>
    </linearGradient>

    <!-- 暖琥珀金书签丝带 -->
    <linearGradient
      id="ribbon"
      x1="400" y1="196"
      x2="400" y2="416"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.55" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>

    <!-- 四角星光点缀 -->
    <linearGradient
      id="spark"
      x1="630" y1="646"
      x2="736" y2="752"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- 四周透明的圆角方形底板（width="920" 符合 macOS 图标模板比例） -->
  <rect
    x="52"
    y="52"
    width="920"
    height="920"
    rx="222"
    fill="url(#background)"
  />

  <rect
    x="52"
    y="52"
    width="920"
    height="920"
    rx="222"
    fill="url(#bgSheen)"
  />

  <!-- 象牙白折角笔记纸页 -->
  <path
    d="
      M 304 196
      L 612 196
      L 764 348
      L 764 780
      C 764 807, 743 828, 716 828
      L 304 828
      C 277 828, 256 807, 256 780
      L 256 244
      C 256 217, 277 196, 304 196
      Z
    "
    fill="url(#sheet)"
  />

  <!-- 折角下方柔和折痕阴影 -->
  <path
    d="M 612 348 L 764 348 L 764 374 L 628 374 Z"
    fill="url(#foldShadow)"
  />

  <!-- 右上角折角三角 -->
  <path
    d="
      M 612 196
      L 764 348
      L 652 348
      C 630 348, 612 330, 612 308
      Z
    "
    fill="url(#foldFlap)"
  />

  <!-- 极简笔记横线 -->
  <rect x="332" y="468" width="320" height="32" rx="16" fill="#C7CDE0"/>
  <rect x="332" y="544" width="356" height="32" rx="16" fill="#D5DAEA"/>
  <rect x="332" y="620" width="228" height="32" rx="16" fill="#D5DAEA"/>

  <!-- 暖琥珀金书签丝带 -->
  <path
    d="
      M 348 196
      L 452 196
      L 452 408
      L 400 364
      L 348 408
      Z
    "
    fill="url(#ribbon)"
  />

  <!-- 极简几何四角星光 -->
  <path
    d="
      M 684 636
      Q 684 704, 752 704
      Q 684 704, 684 772
      Q 684 704, 616 704
      Q 684 704, 684 636
      Z
    "
    fill="url(#spark)"
  />
</svg>
